<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151713">
  <meta name="description" content="AOT Desk — an Attack on Titan character, titan, and episode field guide.">
  <title>AOT Desk — Scout Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #151713;
      --panel: #1b1e19;
      --panel-light: #22251f;
      --line: #30332c;
      --muted: #898b7f;
      --text: #e8e6dc;
      --cream: #f1eddf;
      --gold: #d9bd79;
      --red: #bd5548;
      --green: #96a47d;
      --mono: "DM Mono", monospace;
      --sans: "DM Sans", sans-serif;
      --display: "Oswald", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font-family: var(--sans); }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 5; width: 226px; display: flex; flex-direction: column;
      padding: 27px 17px 19px; background: #121410; border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 33px; }
    .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid #8e493c; color: #df8b74; font: 600 15px var(--display); transform: rotate(-45deg); }
    .brand-mark span { transform: rotate(45deg); }
    .brand-name { font: 600 21px var(--display); letter-spacing: 1.4px; color: var(--cream); }
    .brand-caption { color: var(--muted); font: 9px var(--mono); letter-spacing: 1.4px; margin-top: 2px; }
    .nav-label { padding: 0 10px; margin: 0 0 9px; font: 9px var(--mono); letter-spacing: 1.7px; color: #696d61; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { width: 100%; height: 41px; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; border-radius: 4px; padding: 0 11px; color: #999b8e; background: transparent; text-align: left; cursor: pointer; transition: .2s ease; }
    .nav-item:hover { color: var(--cream); background: #1a1d18; }
    .nav-item.active { background: #24241e; border-color: #3b382c; color: var(--gold); }
    .nav-icon { width: 18px; color: currentColor; text-align: center; font: 15px var(--mono); }
    .nav-count { margin-left: auto; font: 10px var(--mono); color: #65685e; }
    .sidebar-spacer { flex: 1; }
    .dispatch { padding: 13px; margin: 0 2px 19px; border: 1px solid #34342b; background: linear-gradient(145deg, #22221c, #181a16); }
    .dispatch-tag { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; color: var(--gold); font: 9px var(--mono); letter-spacing: 1px; }
    .live-dot { width: 6px; height: 6px; background: #9aa77a; border-radius: 50%; box-shadow: 0 0 8px #9aa77a88; }
    .dispatch p { margin: 0; color: #898b7f; font-size: 11px; line-height: 1.65; }
    .sidebar-foot { display: flex; justify-content: space-between; color: #66695f; font: 9px var(--mono); letter-spacing: .6px; padding: 0 5px; }
    .main { margin-left: 226px; min-height: 100vh; }
    .topbar { height: 74px; display: flex; justify-content: space-between; align-items: center; padding: 0 5.25%; border-bottom: 1px solid var(--line); }
    .breadcrumb { color: var(--muted); font: 10px var(--mono); letter-spacing: .7px; }
    .breadcrumb strong { color: #d9d7cc; font-weight: 400; }
    .top-actions { display: flex; align-items: center; gap: 20px; }
    .api-state { display: flex; align-items: center; gap: 8px; color: #a8ad99; font: 10px var(--mono); letter-spacing: .4px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #74766a; font-size: 15px; }
    .search { width: 211px; height: 35px; border: 1px solid #35372f; border-radius: 3px; outline: none; padding: 0 10px 0 34px; color: var(--cream); background: #1b1d19; font-size: 11px; }
    .search:focus { border-color: #716443; }
    .search::placeholder { color: #717368; }
    .content { max-width: 1460px; margin: auto; padding: 31px 5.25% 52px; }
    .eyebrow { color: var(--gold); font: 9px var(--mono); letter-spacing: 2px; text-transform: uppercase; }
    .page-heading { margin: 5px 0 19px; color: var(--cream); font: 500 30px var(--display); letter-spacing: .6px; }
    .hero {
      min-height: 305px; position: relative; overflow: hidden; display: flex; align-items: center;
      border: 1px solid #39382e; background: linear-gradient(90deg, #1c1e19 0%, #1b1d19 50%, #24251e 100%);
    }
    .hero::before { position: absolute; inset: 0; content: ""; opacity: .21; background-image: linear-gradient(90deg, #171914 0%, transparent 70%), url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1500&q=80"); background-position: center 46%; background-size: cover; filter: grayscale(1); }
    .hero-copy { position: relative; z-index: 1; width: 60%; padding: 30px 0 30px 38px; }
    .hero-kicker { display: flex; align-items: center; gap: 9px; color: #d2c19b; font: 9px var(--mono); letter-spacing: 1.5px; }
    .hero-kicker::before { content: ""; width: 20px; height: 1px; background: var(--red); }
    .hero-title { margin: 13px 0 8px; color: #f1ecdd; font: 600 clamp(36px, 5vw, 59px)/.98 var(--display); letter-spacing: 1px; text-transform: uppercase; }
    .hero-title em { color: var(--gold); font-style: normal; }
    .hero-description { max-width: 375px; margin: 14px 0 19px; color: #aaa99c; font-size: 11px; line-height: 1.8; }
    .primary-button { min-height: 36px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid #b79a60; border-radius: 2px; padding: 0 14px; background: #c0a36a; color: #191a15; font: 500 10px var(--mono); letter-spacing: .5px; cursor: pointer; transition: .2s; }
    .primary-button:hover { background: #dac188; }
    .primary-button span { font-size: 15px; }
    .hero-visual { width: 45%; height: 100%; position: absolute; right: 0; bottom: 0; }
    .hero-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #1d1f1a 0%, transparent 43%), linear-gradient(0deg, #1c1e19 0%, transparent 35%); }
    .hero-visual img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: .58; mix-blend-mode: screen; filter: saturate(.55) contrast(1.12); }
    .hero-stamp { position: absolute; z-index: 1; right: 19px; top: 18px; border: 1px solid #ded0a322; padding: 7px 9px; color: #c2b795; font: 8px var(--mono); letter-spacing: 1px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 16px 0 27px; border: 1px solid var(--line); background: #1a1c18; }
    .stat { display: flex; align-items: center; gap: 13px; padding: 15px 19px; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: 0; }
    .stat-icon { width: 32px; height: 32px; display: grid; place-items: center; background: #292921; color: var(--gold); font: 14px var(--mono); }
    .stat-number { color: #e9e4d5; font: 500 21px var(--display); }
    .stat-label { margin-top: 2px; color: #85877a; font: 8px var(--mono); letter-spacing: 1px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; margin: 0 0 14px; }
    .section-title { margin: 4px 0 0; color: var(--cream); font: 500 21px var(--display); letter-spacing: .45px; }
    .text-button { padding: 5px 0; border: 0; color: #c8b477; background: transparent; font: 9px var(--mono); letter-spacing: .5px; cursor: pointer; }
    .text-button:hover { color: #f0d99b; }
    .filters { display: flex; gap: 6px; margin-bottom: 14px; }
    .filter-button { padding: 6px 11px; border: 1px solid #34362f; border-radius: 2px; color: #929487; background: transparent; font: 9px var(--mono); cursor: pointer; }
    .filter-button.active, .filter-button:hover { border-color: #6d5d3c; color: var(--gold); background: #24231d; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .profile-card { min-width: 0; border: 1px solid #30332c; background: #1b1e19; cursor: pointer; transition: transform .2s, border-color .2s, background .2s; }
    .profile-card:hover { transform: translateY(-3px); border-color: #686044; background: #20221d; }
    .card-image { height: 158px; position: relative; overflow: hidden; background: linear-gradient(140deg, #393a30, #252820 60%, #1a1c18); }
    .card-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #1b1e19 0%, transparent 55%); }
    .image-placeholder { width: 100%; height: 100%; display: grid; place-content: center; gap: 8px; background: repeating-linear-gradient(135deg, #282a23, #282a23 12px, #22241f 12px, #22241f 24px); color: #b79d65; text-align: center; font: 10px/1.5 var(--mono); letter-spacing: 1px; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; object-position: center 29%; opacity: .78; filter: saturate(.6); transition: transform .35s; }
    .profile-card:hover .card-image img { transform: scale(1.04); }
    .card-tag { position: absolute; z-index: 1; top: 10px; left: 10px; padding: 5px 7px; border: 1px solid #d9bd7950; background: #171914bc; color: #d9bd79; font: 8px var(--mono); letter-spacing: .8px; text-transform: uppercase; }
    .card-score { position: absolute; z-index: 1; top: 9px; right: 10px; color: #e8d8ad; font: 500 14px var(--display); }
    .card-body { padding: 0 13px 13px; }
    .card-name { margin: -1px 0 3px; overflow: hidden; color: var(--cream); font: 500 19px var(--display); letter-spacing: .35px; text-overflow: ellipsis; white-space: nowrap; }
    .card-subtitle { overflow: hidden; color: #929487; font: 9px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .card-divider { height: 1px; margin: 12px 0 9px; background: #32342d; }
    .card-meta { display: flex; justify-content: space-between; gap: 8px; font: 8px var(--mono); }
    .card-meta span:first-child { color: #6f7267; letter-spacing: .5px; }
    .card-meta span:last-child { overflow: hidden; color: #b4b3a7; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .score-track { height: 2px; margin-top: 10px; background: #34362f; }
    .score-fill { height: 100%; background: linear-gradient(90deg, #8d493e, #d5b970); }
    .below-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; margin-top: 29px; }
    .panel { min-width: 0; padding: 16px; border: 1px solid var(--line); background: #1b1e19; }
    .titan-row { display: grid; grid-template-columns: 49px 1fr auto; align-items: center; gap: 11px; padding: 10px 0; border-top: 1px solid #30332c; cursor: pointer; }
    .titan-thumb { width: 49px; height: 48px; overflow: hidden; background: #282a23; }
    .titan-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: .82; }
    .titan-name { color: #e1dfd3; font: 500 15px var(--display); }
    .titan-detail { margin-top: 3px; color: #898b7f; font: 8px var(--mono); }
    .titan-rating { color: var(--gold); font: 12px var(--mono); }
    .episode-row { padding: 10px 0; border-top: 1px solid #30332c; cursor: pointer; }
    .episode-row:hover .episode-name { color: var(--gold); }
    .episode-code { margin-bottom: 4px; color: #bb9661; font: 8px var(--mono); letter-spacing: .8px; }
    .episode-name { color: #d7d5ca; font-size: 10px; line-height: 1.5; }
    .api-note { margin-top: 15px; color: #6f7268; font: 8px/1.6 var(--mono); }
    .view-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; }
    .result-count { color: #838579; font: 9px var(--mono); letter-spacing: .5px; }
    .directory-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .directory-grid .card-image { height: 185px; }
    .episode-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .episode-card { min-height: 88px; padding: 13px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
    .episode-card:hover { border-color: #746241; }
    .episode-card .episode-code { font-size: 9px; }
    .episode-card .episode-name { font-size: 12px; }
    .loading, .empty-state, .error-state { padding: 46px 15px; border: 1px solid var(--line); color: #97998d; text-align: center; font: 11px/1.8 var(--mono); }
    .loading::before { content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 12px; border: 2px solid #45443a; border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { border-color: #664039; color: #d49381; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #080907d9; }
    .modal { width: min(570px, 100%); max-height: 90vh; position: relative; overflow: auto; border: 1px solid #55513f; background: #1b1e19; box-shadow: 0 20px 80px #0009; }
    .modal-image { height: 220px; position: relative; overflow: hidden; background: #292b23; }
    .modal-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #1b1e19, transparent 65%); }
    .modal-image img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: .74; }
    .modal-close { position: absolute; z-index: 1; top: 11px; right: 12px; width: 31px; height: 31px; border: 1px solid #f1eddf55; background: #161813bd; color: var(--cream); cursor: pointer; font-size: 18px; }
    .modal-content { position: relative; margin-top: -24px; padding: 0 22px 23px; }
    .modal-title { margin: 0 0 5px; color: var(--cream); font: 500 29px var(--display); }
    .modal-subtitle { color: var(--gold); font: 9px var(--mono); letter-spacing: .7px; text-transform: uppercase; }
    .modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 19px 0; }
    .modal-stat { padding: 10px; border: 1px solid var(--line); background: #20221d; }
    .modal-stat-label { color: #7d8075; font: 8px var(--mono); letter-spacing: .8px; }
    .modal-stat-value { margin-top: 5px; color: #dedbcc; font: 12px var(--display); }
    .modal-description { color: #a6a69b; font-size: 11px; line-height: 1.8; }
    .modal-list { margin-top: 11px; color: #c4c1b3; font: 9px/1.7 var(--mono); }
    .modal-footnote { margin-top: 14px; color: #77796e; font: 8px/1.7 var(--mono); }
    .mobile-brand { display: none; }
    @media (min-width: 1500px) { .content { padding-top: 38px; } .hero { min-height: 340px; } }
    @media (max-width: 1100px) {
      .sidebar { width: 190px; } .main { margin-left: 190px; }
      .content { padding-right: 4%; padding-left: 4%; }
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directory-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .sidebar { position: sticky; top: 0; width: 100%; height: auto; padding: 10px 14px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0 2px 11px; } .brand-mark { width: 30px; height: 30px; }
      .brand-name { font-size: 17px; } .brand-caption { font-size: 8px; }
      .nav-label, .sidebar-spacer, .dispatch, .sidebar-foot { display: none; }
      .nav-list { grid-template-columns: repeat(4, 1fr); gap: 3px; }
      .nav-item { height: 37px; justify-content: center; gap: 6px; padding: 0 4px; font-size: 10px; }
      .nav-icon { font-size: 13px; } .nav-count { display: none; }
      .main { margin-left: 0; } .topbar { height: 57px; padding: 0 17px; }
      .api-state { font-size: 8px; } .api-state .live-dot { width: 5px; height: 5px; }
      .search { width: 155px; height: 32px; font-size: 10px; }
      .top-actions { gap: 11px; } .content { padding: 23px 17px 38px; }
      .page-heading { font-size: 27px; }
      .hero { min-height: 278px; }
      .hero-copy { width: 78%; padding-left: 22px; }
      .hero-visual { width: 53%; }
      .hero-title { font-size: clamp(38px, 10vw, 53px); }
      .hero-description { max-width: 300px; font-size: 10px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat:nth-child(2) { border-right: 0; } .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .stat { padding: 11px 12px; gap: 9px; } .stat-icon { width: 29px; height: 29px; }
      .below-grid { grid-template-columns: 1fr; }
      .directory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directory-grid .card-image { height: 155px; }
      .episode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 430px) {
      .topbar { padding: 0 12px; } .breadcrumb { font-size: 8px; }
      .search { width: 127px; } .api-state { gap: 5px; }
      .content { padding-right: 12px; padding-left: 12px; }
      .hero { min-height: 260px; } .hero-copy { width: 91%; padding-left: 16px; }
      .hero-visual { width: 60%; opacity: .65; } .hero-description { max-width: 240px; }
      .card-grid { gap: 9px; } .card-image { height: 128px; }
      .directory-grid .card-image { height: 125px; }
      .card-body { padding-right: 10px; padding-left: 10px; }
      .card-name { font-size: 17px; }
      .episode-grid { gap: 7px; }
      .modal-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>壁</span></div>
        <div><div class="brand-name">AOT DESK</div><div class="brand-caption">SCOUT INTELLIGENCE</div></div>
      </div>
      <div class="nav-label">FIELD DATABASE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="characters"><span class="nav-icon">♙</span>Characters<span class="nav-count" id="character-count">—</span></button>
        <button class="nav-item" data-view="titans"><span class="nav-icon">♜</span>Titans<span class="nav-count" id="titan-count">—</span></button>
        <button class="nav-item" data-view="episodes"><span class="nav-icon">▤</span>Episodes<span class="nav-count" id="episode-count">—</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="dispatch">
        <div class="dispatch-tag"><span class="live-dot"></span>SCOUT DISPATCH</div>
        <p>Knowledge is our only weapon. Browse the field files and stay vigilant beyond the walls.</p>
      </div>
      <div class="sidebar-foot"><span>EST. 845</span><span>WALLS ROSE · MARIA · SHEENA</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">SCOUT REGIMENT&nbsp; / &nbsp;<strong id="breadcrumb-current">COMMAND DESK</strong></div>
        <div class="top-actions">
          <div class="api-state"><span class="live-dot" id="api-dot"></span><span id="api-status">CONNECTING</span></div>
          <label class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="Search field files..." autocomplete="off" aria-label="Search"></label>
        </div>
      </header>
      <div class="content" id="content"><div class="loading">Loading field intelligence from the Scout archives...</div></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <script>
    (() => {
      const API = "https://api.attackontitanapi.com";
      const state = { characters: [], titans: [], episodes: [], view: "overview", filter: "all", query: "" };
      const content = document.getElementById("content");
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
      const nameFromUrl = (url) => {
        const id = Number(String(url || "").split("/").pop());
        return state.characters.find((item) => item.id === id)?.name || "";
      };
      const episodeFromUrl = (url) => {
        const id = Number(String(url || "").split("/").pop());
        return state.episodes.find((item) => item.id === id);
      };
      const fallbackImage = (kind) => {
        const collections = kind === "titan" ? [state.titans, state.characters, state.episodes]
          : kind === "episode" ? [state.episodes, state.characters, state.titans]
          : [state.characters, state.titans, state.episodes];
        return collections.flat().find((item) => /^https?:\/\//i.test(item.img || ""))?.img || "";
      };
      const imageMarkup = (item, kind, alt = item.name || "") => {
        const source = /^https?:\/\//i.test(item.img || "") ? item.img : fallbackImage(kind);
        if (!source) return `<div class="image-placeholder" role="img" aria-label="${esc(alt)}"><span>SCOUT ARCHIVE</span><span>IMAGE NOT ON FILE</span></div>`;
        const fallback = source === item.img ? fallbackImage(kind) : "";
        return `<img src="${esc(source)}" alt="${esc(alt)}" loading="lazy"${fallback && fallback !== source ? ` data-fallback="${esc(fallback)}"` : ""} onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;delete this.dataset.fallback}else{this.hidden=true;this.parentElement.classList.add('image-unavailable')}">`;
      };
      const seasonName = (episode) => {
        if (!episode) return "Unknown";
        return `Season ${episode.episode.match(/^S(\d+)/)?.[1] || "?"}`;
      };
      const firstAppearance = (item) => {
        const episodes = (item.episodes || []).map(episodeFromUrl).filter(Boolean)
          .sort((a, b) => a.id - b.id);
        return episodes[0] || null;
      };
      const scoreFor = (item, kind) => {
        if (kind === "titan") return Math.min(99, 58 + (item.abilities?.length || 0) * 6 + (item.former_inheritors?.length ? 8 : 0) + (parseInt(item.height, 10) >= 15 ? 8 : 0));
        const titanBonus = item.species?.includes("Intelligent Titan") ? 22 : 0;
        const roleBonus = Math.min(12, (item.roles?.length || 0) * 5);
        const appearanceBonus = Math.min(14, Math.floor((item.episodes?.length || 0) / 6));
        return Math.min(99, 50 + titanBonus + roleBonus + appearanceBonus);
      };
      const affiliation = (character) => character.groups?.[0]?.name || character.occupation || "Unlisted";
      const characterCard = (item) => {
        const episode = firstAppearance(item);
        const titan = item.roles?.[0] ? item.roles[0].replace(/s$/i, "") : "";
        const type = item.species?.includes("Intelligent Titan") ? "Titan shifter" : (item.gender || "Character");
        const score = scoreFor(item, "character");
        const meta = episode ? `${seasonName(episode)} · ${episode.episode}` : "No episode listed";
        return `<article class="profile-card" tabindex="0" role="button" data-kind="character" data-id="${item.id}" aria-label="Open ${esc(item.name)} dossier">
          <div class="card-image">${imageMarkup(item, "character")}
            <span class="card-tag">${esc(type)}</span><span class="card-score">${score}<small style="font:8px var(--mono);color:#99947e"> /100</small></span>
          </div>
          <div class="card-body"><h3 class="card-name">${esc(item.name)}</h3>
            <div class="card-subtitle">${esc(item.alias?.[0] || item.occupation || affiliation(item))}</div>
            <div class="card-divider"></div>
            <div class="card-meta"><span>ARC / FIRST SEEN</span><span>${esc(meta)}</span></div>
            <div class="card-meta" style="margin-top:6px"><span>UNIT</span><span>${esc(affiliation(item))}</span></div>
            <div class="score-track"><div class="score-fill" style="width:${score}%"></div></div>
          </div></article>`;
      };
      const titanCard = (item) => {
        const score = scoreFor(item, "titan");
        const heir = nameFromUrl(item.current_inheritor);
        return `<article class="profile-card" tabindex="0" role="button" data-kind="titan" data-id="${item.id}" aria-label="Open ${esc(item.name)} dossier">
          <div class="card-image">${imageMarkup(item, "titan")}
            <span class="card-tag">Nine Titans</span><span class="card-score">${score}<small style="font:8px var(--mono);color:#99947e"> /100</small></span>
          </div>
          <div class="card-body"><h3 class="card-name">${esc(item.name)}</h3>
            <div class="card-subtitle">${esc(item.height || "Unknown height")} · ${esc(item.allegiance || "Unknown allegiance")}</div>
            <div class="card-divider"></div>
            <div class="card-meta"><span>INHERITOR</span><span>${esc(heir || "Unknown")}</span></div>
            <div class="card-meta" style="margin-top:6px"><span>ABILITIES</span><span>${esc(item.abilities?.length || 0)} recorded</span></div>
            <div class="score-track"><div class="score-fill" style="width:${score}%"></div></div>
          </div></article>`;
      };
      const visibleCharacters = () => {
        let items = state.characters;
        if (state.filter === "scouts") items = items.filter((item) => item.groups?.some((group) => /scout/i.test(group.name)));
        if (state.filter === "shifters") items = items.filter((item) => item.species?.includes("Intelligent Titan"));
        if (state.filter === "warriors") items = items.filter((item) => item.groups?.some((group) => /warrior/i.test(group.name)) || /Marley/i.test(item.birthplace || ""));
        return items.filter((item) => `${item.name} ${item.alias?.join(" ")} ${item.occupation} ${item.roles?.join(" ")} ${affiliation(item)}`.toLowerCase().includes(state.query));
      };
      const visibleTitans = () => state.titans.filter((item) => `${item.name} ${item.allegiance} ${item.abilities?.join(" ")}`.toLowerCase().includes(state.query));
      const visibleEpisodes = () => state.episodes.filter((item) => `${item.name} ${item.episode}`.toLowerCase().includes(state.query));
      const header = (eyebrow, title, count) => `<div class="eyebrow">${eyebrow}</div><h1 class="page-heading">${title}</h1><div class="view-toolbar"><div class="result-count">${count}</div></div>`;
      const renderOverview = () => {
        const featured = state.characters.find((item) => item.id === 188) || state.characters[0];
        const recentEpisodes = [...state.episodes].sort((a, b) => b.id - a.id).slice(0, 3);
        const featuredCards = [188, 2, 1, 86, 184, 87].map((id) => state.characters.find((item) => item.id === id)).filter(Boolean);
        const hero = featured ? `<section class="hero">
          <div class="hero-copy"><div class="hero-kicker">INTELLIGENCE BRIEFING&nbsp; · &nbsp;FILE 001</div>
            <h1 class="hero-title">Beyond<br>the <em>Walls.</em></h1>
            <p class="hero-description">The world is cruel. The field files are open. Explore the people, powers, and battles that shaped humanity's fight for freedom.</p>
            <button class="primary-button" data-action="explore">EXPLORE THE FILES <span>↗</span></button>
          </div>
          <div class="hero-visual">${imageMarkup(featured, "character")}</div>
          <div class="hero-stamp">SCOUT REGIMENT&nbsp; / &nbsp;845</div>
        </section>` : "";
        return `<div class="eyebrow">SCOUT REGIMENT&nbsp; / &nbsp;FIELD OVERVIEW</div><h1 class="page-heading">Command Desk</h1>
          ${hero}
          <section class="stats" aria-label="Archive statistics">
            <div class="stat"><div class="stat-icon">♙</div><div><div class="stat-number">${state.characters.length}</div><div class="stat-label">CHARACTER FILES</div></div></div>
            <div class="stat"><div class="stat-icon">♜</div><div><div class="stat-number">${state.titans.length}</div><div class="stat-label">TITAN CLASSES</div></div></div>
            <div class="stat"><div class="stat-icon">▤</div><div><div class="stat-number">${state.episodes.length}</div><div class="stat-label">EPISODE RECORDS</div></div></div>
            <div class="stat"><div class="stat-icon">✳</div><div><div class="stat-number">845</div><div class="stat-label">YEAR OF THE WALLS</div></div></div>
          </section>
          <section><div class="section-head"><div><div class="eyebrow">PERSONNEL DOSSIERS</div><h2 class="section-title">Faces of the fight</h2></div><button class="text-button" data-view="characters">ALL CHARACTERS&nbsp; ↗</button></div>
            <div class="filters" id="filters">
              <button class="filter-button ${state.filter === "all" ? "active" : ""}" data-filter="all">ALL FILES</button>
              <button class="filter-button ${state.filter === "scouts" ? "active" : ""}" data-filter="scouts">SCOUTS</button>
              <button class="filter-button ${state.filter === "shifters" ? "active" : ""}" data-filter="shifters">SHIFTERS</button>
              <button class="filter-button ${state.filter === "warriors" ? "active" : ""}" data-filter="warriors">WARRIORS</button>
            </div>
            <div class="card-grid">${featuredCards.map(characterCard).join("")}</div>
          </section>
          <div class="below-grid">
            <section class="panel"><div class="section-head"><div><div class="eyebrow">TITAN REGISTRY</div><h2 class="section-title">The Nine</h2></div><button class="text-button" data-view="titans">FULL REGISTRY&nbsp; ↗</button></div>
              ${state.titans.slice(0, 4).map((titan) => `<div class="titan-row" role="button" tabindex="0" data-kind="titan" data-id="${titan.id}">
                <div class="titan-thumb">${imageMarkup(titan, "titan", "")}</div>
                <div><div class="titan-name">${esc(titan.name)}</div><div class="titan-detail">${esc(titan.height || "Unknown height")} · ${esc(nameFromUrl(titan.current_inheritor) || "Inheritor unknown")}</div></div>
                <div class="titan-rating">${scoreFor(titan, "titan")}</div></div>`).join("")}
            </section>
            <section class="panel"><div class="section-head"><div><div class="eyebrow">BATTLE CHRONICLE</div><h2 class="section-title">Episode log</h2></div><button class="text-button" data-view="episodes">ALL EPISODES&nbsp; ↗</button></div>
              ${recentEpisodes.map((episode) => `<div class="episode-row" role="button" tabindex="0" data-kind="episode" data-id="${episode.id}"><div class="episode-code">${esc(episode.episode)}</div><div class="episode-name">${esc(episode.name)}</div></div>`).join("")}
              <div class="api-note">FIELD RATINGS ARE A DESK INDEX, NOT OFFICIAL API DATA.<br>ARCHIVE DATA PROVIDED BY ATTACK ON TITAN API.</div>
            </section>
          </div>`;
      };
      const renderDirectory = () => {
        if (state.view === "characters") {
          const items = visibleCharacters();
          return `${header("PERSONNEL DOSSIERS", "Character Files", `${items.length} OF ${state.characters.length} FILES`)}
            <div class="filters">
              <button class="filter-button ${state.filter === "all" ? "active" : ""}" data-filter="all">ALL FILES</button>
              <button class="filter-button ${state.filter === "scouts" ? "active" : ""}" data-filter="scouts">SCOUTS</button>
              <button class="filter-button ${state.filter === "shifters" ? "active" : ""}" data-filter="shifters">SHIFTERS</button>
              <button class="filter-button ${state.filter === "warriors" ? "active" : ""}" data-filter="warriors">WARRIORS</button>
            </div><div class="card-grid directory-grid">${items.map(characterCard).join("") || '<div class="empty-state">No personnel files match this search.</div>'}</div>`;
        }
        if (state.view === "titans") {
          const items = visibleTitans();
          return `${header("NINE TITAN REGISTRY", "Titan Files", `${items.length} OF ${state.titans.length} CLASSES`)}
            <div class="card-grid directory-grid">${items.map(titanCard).join("") || '<div class="empty-state">No titan files match this search.</div>'}</div>`;
        }
        const items = visibleEpisodes();
        return `${header("BATTLE CHRONICLE", "Episode Guide", `${items.length} OF ${state.episodes.length} EPISODES`)}
          <div class="episode-grid">${items.map((episode) => `<article class="episode-card" tabindex="0" role="button" data-kind="episode" data-id="${episode.id}">
            <div class="episode-code">${esc(episode.episode)}</div><div class="episode-name">${esc(episode.name)}</div></article>`).join("") || '<div class="empty-state">No episodes match this search.</div>'}</div>`;
      };
      const render = () => {
        document.getElementById("breadcrumb-current").textContent = ({ overview: "COMMAND DESK", characters: "PERSONNEL DOSSIERS", titans: "TITAN REGISTRY", episodes: "BATTLE CHRONICLE" })[state.view];
        document.querySelectorAll(".nav-item").forEach((item) => item.classList.toggle("active", item.dataset.view === state.view));
        content.innerHTML = state.view === "overview" ? renderOverview() : renderDirectory();
      };
      const displayName = (item) => item.name || "Unknown";
      const openDossier = (kind, id) => {
        const collection = kind === "character" ? state.characters : kind === "titan" ? state.titans : state.episodes;
        const item = collection.find((entry) => entry.id === Number(id));
        if (!item) return;
        const root = document.getElementById("modal-root");
        if (kind === "episode") {
          const names = item.characters?.map((url) => nameFromUrl(url)).filter(Boolean);
          root.innerHTML = `<div class="modal-backdrop" data-close><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(item.name)}">
            <button class="modal-close" aria-label="Close dossier" data-close>×</button><div class="modal-image">${imageMarkup(item, "episode", item.name)}</div>
            <div class="modal-content"><h2 class="modal-title">${esc(displayName(item))}</h2><div class="modal-subtitle">${esc(item.episode || "EPISODE RECORD")}</div>
              <div class="modal-stats"><div class="modal-stat"><div class="modal-stat-label">EPISODE</div><div class="modal-stat-value">${esc(item.episode || "—")}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">ARCHIVE ID</div><div class="modal-stat-value">#${esc(item.id)}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">CAST LISTED</div><div class="modal-stat-value">${item.characters?.length || 0}</div></div></div>
              <div class="modal-list"><strong>EPISODE RECORD</strong><br>${names?.length ? esc(names.slice(0, 12).join(" · ")) : "No character records linked."}</div></div></section></div>`;
        } else if (kind === "titan") {
          const heir = nameFromUrl(item.current_inheritor);
          root.innerHTML = `<div class="modal-backdrop" data-close><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(item.name)}">
            <button class="modal-close" aria-label="Close dossier" data-close>×</button><div class="modal-image">${imageMarkup(item, "titan", item.name)}</div>
            <div class="modal-content"><h2 class="modal-title">${esc(displayName(item))}</h2><div class="modal-subtitle">TITAN REGISTRY&nbsp; · &nbsp;${esc(item.allegiance || "ALLEGIANCE UNKNOWN")}</div>
              <div class="modal-stats"><div class="modal-stat"><div class="modal-stat-label">FIELD RATING</div><div class="modal-stat-value">${scoreFor(item, "titan")} / 100</div></div>
              <div class="modal-stat"><div class="modal-stat-label">HEIGHT</div><div class="modal-stat-value">${esc(item.height || "Unknown")}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">CURRENT INHERITOR</div><div class="modal-stat-value">${esc(heir || "Unknown")}</div></div></div>
              <div class="modal-list"><strong>KNOWN ABILITIES</strong><br>${esc(item.abilities?.join(" · ") || "No abilities listed.")}</div>
              <div class="modal-footnote">Field rating is an AOT Desk index estimated from listed abilities, height, and inheritor records—not a canonical statistic.</div></div></section></div>`;
        } else {
          const episode = firstAppearance(item);
          const groups = item.groups?.map((group) => group.name).filter(Boolean).join(" · ");
          const species = item.species?.join(" · ") || "Unknown";
          const height = item.height || "Unknown";
          root.innerHTML = `<div class="modal-backdrop" data-close><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(item.name)}">
            <button class="modal-close" aria-label="Close dossier" data-close>×</button><div class="modal-image">${imageMarkup(item, "character", item.name)}</div>
            <div class="modal-content"><h2 class="modal-title">${esc(displayName(item))}</h2><div class="modal-subtitle">${esc(item.alias?.[0] || item.occupation || "PERSONNEL FILE")}</div>
              <div class="modal-stats"><div class="modal-stat"><div class="modal-stat-label">DESK SCORE</div><div class="modal-stat-value">${scoreFor(item, "character")} / 100</div></div>
              <div class="modal-stat"><div class="modal-stat-label">ARC / FIRST APPEARANCE</div><div class="modal-stat-value">${episode ? `${esc(seasonName(episode))} · ${esc(episode.episode)}` : "Not listed"}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">STATUS</div><div class="modal-stat-value">${esc(item.status || "Unknown")}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">AGE / GENDER</div><div class="modal-stat-value">${esc(item.age || "—")} · ${esc(item.gender || "—")}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">HEIGHT</div><div class="modal-stat-value">${esc(height)}</div></div>
              <div class="modal-stat"><div class="modal-stat-label">SPECIES</div><div class="modal-stat-value">${esc(species)}</div></div></div>
              <div class="modal-list"><strong>UNIT</strong><br>${esc(groups || item.occupation || "No unit listed")}</div>
              <div class="modal-list"><strong>ROLES</strong><br>${esc(item.roles?.join(" · ") || "No role listed")}</div>
              <div class="modal-footnote">The API does not identify story arcs, so the season and earliest listed episode are shown as an approximation. The Desk score is an estimated index from listed abilities and roles—not an official score.</div></div></section></div>`;
        }
        root.querySelector("[data-close]").focus?.();
      };
      const showError = (error) => {
        document.getElementById("api-status").textContent = "ARCHIVE OFFLINE";
        document.getElementById("api-dot").style.background = "#bd5548";
        content.innerHTML = `<div class="error-state">Could not load the AOT API archives.<br>${esc(error.message || "Check your connection and reload the page.")}<br><br><button class="primary-button" data-action="retry">RETRY CONNECTION</button></div>`;
      };
      const fetchCollection = async (path) => {
        const response = await fetch(`${API}/${path}`);
        if (!response.ok) throw new Error(`${path} request failed (${response.status}).`);
        const first = await response.json();
        if (!Array.isArray(first.results) || !first.info) throw new Error(`Unexpected ${path} archive response.`);
        const pages = Number(first.info.pages) || 1;
        if (pages <= 1) return first.results;
        const remaining = await Promise.all(Array.from({ length: pages - 1 }, async (_, index) => {
          const pageResponse = await fetch(`${API}/${path}?page=${index + 2}`);
          if (!pageResponse.ok) throw new Error(`${path} page ${index + 2} request failed (${pageResponse.status}).`);
          const page = await pageResponse.json();
          if (!Array.isArray(page.results)) throw new Error(`Unexpected ${path} page ${index + 2} response.`);
          return page.results;
        }));
        return first.results.concat(...remaining);
      };
      const load = async () => {
        content.innerHTML = '<div class="loading">Loading field intelligence from the Scout archives...</div>';
        try {
          const [characters, titans, episodes] = await Promise.all([
            fetchCollection("characters"), fetchCollection("titans"), fetchCollection("episodes")
          ]);
          state.characters = characters; state.titans = titans; state.episodes = episodes;
          document.getElementById("character-count").textContent = characters.length;
          document.getElementById("titan-count").textContent = titans.length;
          document.getElementById("episode-count").textContent = episodes.length;
          document.getElementById("api-status").textContent = "ARCHIVES ONLINE";
          render();
        } catch (error) {
          console.error("AOT Desk archive request failed:", error);
          showError(error);
        }
      };
      document.addEventListener("click", (event) => {
        const target = event.target.closest("button, [data-kind], [data-close]");
        if (!target) return;
        if (target.dataset.close !== undefined) {
          if (target === event.target || target.classList.contains("modal-close")) document.getElementById("modal-root").innerHTML = "";
          return;
        }
        if (target.dataset.view) {
          state.view = target.dataset.view; state.filter = "all"; render(); return;
        }
        if (target.dataset.filter) { state.filter = target.dataset.filter; render(); return; }
        if (target.dataset.action === "explore") { state.view = "characters"; render(); return; }
        if (target.dataset.action === "retry") { load(); return; }
        if (target.dataset.kind) openDossier(target.dataset.kind, target.dataset.id);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") document.getElementById("modal-root").innerHTML = "";
        if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-kind]")) {
          event.preventDefault(); openDossier(event.target.dataset.kind, event.target.dataset.id);
        }
      });
      document.getElementById("search").addEventListener("input", (event) => {
        state.query = event.target.value.trim().toLowerCase();
        if (state.view === "overview" && state.query) state.view = "characters";
        render();
      });
      load();
    })();
  </script>
</body>
</html>
